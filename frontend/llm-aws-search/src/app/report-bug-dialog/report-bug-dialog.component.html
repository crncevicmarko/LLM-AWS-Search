<h2 mat-dialog-title>Report Bug</h2>

<form [formGroup]="bugForm" class="bug-form" (ngSubmit)="onReport()">
  <mat-form-field appearance="outline" class="full-width">
    <!-- <mat-label>Email</mat-label> -->
    <input matInput placeholder="Enter your email" formControlName="email" />
    <mat-error *ngIf="bugForm.get('email')?.hasError('required')">
      Email is required
    </mat-error>
    <mat-error *ngIf="bugForm.get('email')?.hasError('email')">
      Enter a valid email
    </mat-error>
  </mat-form-field>

  <mat-form-field appearance="outline" class="full-width">
    <!-- <mat-label>Bug Description</mat-label> -->
    <textarea
      matInput
      placeholder="Describe the bug..."
      formControlName="description"
      rows="4"
    ></textarea>
    <mat-error *ngIf="bugForm.get('description')?.hasError('required')">
      Description is required
    </mat-error>
  </mat-form-field>

  <div class="buttons">
    <button mat-button type="button" (click)="onCancel()">Cancel</button>
    <button mat-raised-button color="primary" type="submit" [disabled]="bugForm.invalid" class="pink-report-button">Report</button>
  </div>
</form>
